<!doctype html>
<!--
  https://projectlead.io/lead-auth/return : le lien de retour de « Continuer avec Google » (contrat d'ERPlead
  docs/GOOGLE-APP.md § 3c ; code : src/leadAuthReturn.ts, src/lib/leadAppAuth.ts). Ce lien est réservé à l'app (Universal
  Link, App Link vérifié) : cette page ne s'affiche que si l'app ne s'est pas ouverte. Servie telle quelle (200, aucune
  redirection, Cache-Control: no-store, Referrer-Policy: no-referrer, X-Robots-Tag: noindex : scripts/vercel-build.mjs),
  sans ressource ni script tiers. Hors de l'app, le premier script efface le code de l'adresse et de l'historique.
-->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#eceae7" />
    <title>ProjectLead</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      // Avant tout : hors de l'app, le code quitte la barre d'adresse et l'historique (la langue est gardée pour le texte).
      (function () {
        try {
          var C = window.Capacitor
          var app = !!(C && typeof C.isNativePlatform === 'function' && C.isNativePlatform() === true)
          var l = new URLSearchParams(location.search).get('locale')
          if (l && /^[a-z]{2}$/.test(l)) document.documentElement.setAttribute('data-locale', l)
          if (!app) history.replaceState(null, '', '/lead-auth/return')
        } catch (e) { /* page sans script : rien à effacer de plus */ }
      })()
    </script>
    <style>
      :root { color-scheme: light; }
      html, body { margin: 0; background: #eceae7; color: #1b1a19; }
      body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      main { box-sizing: border-box; max-width: 460px; margin: 0 auto; padding: 56px 20px 40px; }
      .panel { background: #fff; border: 1px solid #cfcac4; padding: 28px 24px; }
      .mark { display: inline-block; background: #9a6a00; color: #fff; font-weight: 800; font-size: 14px; letter-spacing: .02em; padding: 6px 8px; margin-bottom: 18px; }
      h1 { font-size: 22px; line-height: 1.25; margin: 0 0 14px; }
      p { margin: 0 0 12px; }
      p.muted { color: #67625c; font-size: 14px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main data-lead-auth-return hidden>
      <div class="panel">
        <span class="mark" aria-hidden="true">PL</span>
        <h1 data-title></h1>
        <p data-body></p>
        <p data-android hidden></p>
        <p class="muted" data-nothing></p>
      </div>
    </main>
    <script type="module" src="/src/leadAuthReturn.ts"></script>
  </body>
</html>
